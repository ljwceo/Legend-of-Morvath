<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speler-clips (voorbeeld)</title>
    <!--
      Dev-only preview of public/zones/greyhaven/player.glb: plays every clip on the skinned model.
      Not part of the game and not in the build. Run `npm run dev`, then open
      http://localhost:5173/Legend-of-Morvath/tools/player-preview/index.html
      Colours come from materials.json. Plain: flat Lambert colours, the Outline hulls as dark
      front faces. "Game-shader": the game's ToonMaterial (src/render/toon, served by Vite),
      textured skin and tunic, the skin tone from appearance.json as a tint over the texture,
      exactly as ScenePlayerModel does it (step A.3a).
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14141c;
        color: #e8e3d4;
        font:
          14px/1.4 system-ui,
          sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 230px;
        overflow-y: auto;
        background: rgba(20, 20, 28, 0.88);
        border-right: 1px solid #2d2d3d;
        padding: 10px;
      }
      #panel h1 {
        font-size: 15px;
        margin: 0 0 8px;
        color: #d4a84b;
      }
      #clips {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #clips button {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        background: #23233a;
        color: inherit;
        border: 1px solid #34344f;
        border-radius: 5px;
        padding: 5px 8px;
        cursor: pointer;
        font: inherit;
      }
      #clips button:hover {
        background: #2e2e4c;
      }
      #clips button.on {
        background: #d4a84b;
        color: #14141c;
        border-color: #d4a84b;
      }
      #clips small {
        opacity: 0.7;
      }
      #bar {
        position: fixed;
        left: 230px;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        background: rgba(20, 20, 28, 0.88);
        border-top: 1px solid #2d2d3d;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 18px;
      }
      #bar label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #bar button {
        background: #23233a;
        color: inherit;
        border: 1px solid #34344f;
        border-radius: 5px;
        padding: 4px 12px;
        cursor: pointer;
        font: inherit;
      }
      #seek {
        flex: 1 1 260px;
        min-width: 160px;
      }
      #info {
        position: fixed;
        top: 10px;
        right: 14px;
        text-align: right;
        opacity: 0.85;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font-size: 16px;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <h1>Speler-clips</h1>
      <div id="clips"></div>
      <p class="hint">
        Slepen = draaien, scrollen = zoom, rechtermuisknop = verschuiven.<br />
        Spatie = pauze, pijltje omhoog/omlaag = vorige/volgende clip.
      </p>
    </div>
    <div id="bar">
      <button id="pause">Pauze</button>
      <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
      <span id="time">0.00 / 0.00 s</span>
      <label
        >Snelheid
        <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" />
        <span id="speedv">1.00×</span>
      </label>
      <label><input id="loop" type="checkbox" checked /> Herhalen</label>
      <label><input id="sword" type="checkbox" checked /> Zwaard</label>
      <label><input id="staff" type="checkbox" /> Staf</label>
      <label><input id="game" type="checkbox" /> Game-shader</label>
      <label
        >Huid
        <select id="skin"></select
      ></label>
    </div>
    <div id="info"></div>
    <div id="msg">Laden…</div>

    <script type="module">
      import {
        AmbientLight,
        AnimationMixer,
        ArrowHelper,
        Box3,
        Clock,
        Color,
        DirectionalLight,
        GridHelper,
        LinearSRGBColorSpace,
        LoopOnce,
        LoopRepeat,
        Mesh,
        MeshBasicMaterial,
        MeshLambertMaterial,
        PerspectiveCamera,
        Scene,
        SkinnedMesh,
        Vector3,
        WebGLRenderer,
        FrontSide,
        SRGBColorSpace,
        ClampToEdgeWrapping,
        TextureLoader,
      } from 'three';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      // The game's own toon shader (TypeScript, compiled by the Vite dev server).
      import {
        createSharedLightUniforms,
        createToonMaterial,
      } from '../../src/render/toon/ToonMaterial.ts';
      import { textureTint } from '../../src/world/scene/ScenePlayerModel.ts';

      const $ = (id) => document.getElementById(id);
      const say = (text) => {
        $('msg').textContent = text;
        $('msg').style.display = text ? 'grid' : 'none';
      };

      const renderer = new WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = SRGBColorSpace;
      $('view').append(renderer.domElement);
      const scene = new Scene();
      scene.background = new Color(0x1a1a28);
      const camera = new PerspectiveCamera(40, 1, 0.05, 100);
      camera.position.set(0.9, 1.4, 3.6);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.9, 0);
      controls.update();
      scene.add(new AmbientLight(0xffffff, 1.6));
      const sun = new DirectionalLight(0xffffff, 2.2);
      sun.position.set(2, 4, 3);
      scene.add(sun);
      scene.add(new GridHelper(6, 12, 0x555577, 0x2e2e44));
      // The character looks along +z (the game's heading 0): an arrow on the floor in front of it.
      scene.add(
        new ArrowHelper(new Vector3(0, 0, 1), new Vector3(0, 0.01, 0.4), 0.8, 0xd4a84b, 0.15, 0.1),
      );

      function resize() {
        const w = innerWidth,
          h = innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      addEventListener('resize', resize);
      resize();

      const here = (path) => new URL(path, location.href).toString();
      const draco = new DRACOLoader();
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);

      const rgb = (c) => new Color().setRGB(c[0], c[1], c[2], LinearSRGBColorSpace);

      function plainMaterial(info) {
        if (!info) return new MeshLambertMaterial({ color: 0xb0b0b0 });
        if (info.kind === 'outline')
          return new MeshBasicMaterial({ color: rgb(info.color), side: FrontSide });
        if (info.kind === 'emit') {
          const k = Math.min(1, (info.strength ?? 1) * 0.5);
          return new MeshBasicMaterial({ color: rgb(info.color).multiplyScalar(0.5 + k) });
        }
        return new MeshLambertMaterial({
          color: rgb(info.color ?? [0.7, 0.7, 0.7]),
          side: FrontSide,
        });
      }

      // A fixed afternoon light for the game shader (the game's day-night cycle writes these).
      const shared = createSharedLightUniforms();
      shared.lightDir.value.set(2, 4, 3).normalize();
      shared.sunCol.value.setRGB(1.0, 0.95, 0.85, LinearSRGBColorSpace);
      shared.shadowCol.value.setRGB(0.42, 0.46, 0.62, LinearSRGBColorSpace);
      shared.fogCol.value.setRGB(0.6, 0.65, 0.75, LinearSRGBColorSpace);
      shared.fogNear.value = 200;
      shared.fogFar.value = 400;
      const textures = new Map();
      const textured = new Map(); // material name -> ShaderMaterial (its tint is updated live)
      let skinTone = null; // hex of the chosen tone, null = the texture as painted

      function gameMaterial(name, info) {
        if (!info) return plainMaterial(info);
        if (info.kind === 'outline')
          return new MeshBasicMaterial({ color: rgb(info.color), side: FrontSide });
        if (info.kind === 'emit') {
          return createToonMaterial(shared, {
            mode: 'glow',
            color: rgb(info.color),
            strength: info.strength,
          });
        }
        if (info.kind === 'textured') {
          let map = textures.get(info.tex);
          if (!map) {
            // Same as SceneAssets: sRGB, glTF orientation (flipY off), not repeated.
            map = new TextureLoader().load(here('../../zones/greyhaven/tex/' + info.tex));
            map.colorSpace = SRGBColorSpace;
            map.flipY = false;
            map.wrapS = map.wrapT = ClampToEdgeWrapping;
            map.anisotropy = 4;
            textures.set(info.tex, map);
          }
          const material = createToonMaterial(shared, { mode: 'textured', map });
          textured.set(name, material);
          applySkinTone();
          return material;
        }
        return createToonMaterial(shared, {
          mode: 'lit',
          color: rgb(info.color ?? [0.7, 0.7, 0.7]),
        });
      }

      function applySkinTone() {
        const material = textured.get('Skin');
        const info = materialsInfo.materials.Skin;
        if (!material || !info) return;
        if (skinTone)
          textureTint(new Color(skinTone), info.color ?? [1, 1, 1], material.uniforms.tint.value);
        else material.uniforms.tint.value.setRGB(1, 1, 1);
      }

      let materialsInfo = { materials: {} };
      const plain = new Map();
      const game = new Map();
      const meshes = [];

      function applyMaterials() {
        const useGame = $('game').checked;
        const cache = useGame ? game : plain;
        for (const o of meshes) {
          const swap = (m) => {
            let material = cache.get(m.name);
            if (!material) {
              const info = materialsInfo.materials[m.name];
              material = useGame ? gameMaterial(m.name, info) : plainMaterial(info);
              cache.set(m.name, material);
            }
            return material;
          };
          o.material = Array.isArray(o.source) ? o.source.map(swap) : swap(o.source);
        }
        $('skin').disabled = !useGame;
      }

      let mixer = null;
      let actions = [];
      let current = null;
      let paused = false;
      let speed = 1;
      const clock = new Clock();
      const buttons = [];

      function play(index) {
        const next = actions[index];
        if (!next) return;
        if (current) current.stop();
        current = next;
        current.reset();
        current.setLoop($('loop').checked ? LoopRepeat : LoopOnce, Infinity);
        current.clampWhenFinished = true;
        current.paused = false;
        current.play();
        buttons.forEach((b, i) => b.classList.toggle('on', i === index));
        buttons[index]?.scrollIntoView({ block: 'nearest' });
        $('seek').max = String(current.getClip().duration);
        paused = false;
        $('pause').textContent = 'Pauze';
      }

      function step(delta) {
        if (!current) return;
        const i = actions.indexOf(current);
        play((i + delta + actions.length) % actions.length);
      }

      async function start() {
        try {
          materialsInfo = await (
            await fetch(here('../../zones/greyhaven/materials.json'), { cache: 'no-cache' })
          ).json();
        } catch (e) {
          console.warn('materials.json not read, grey materials', e);
        }
        try {
          const appearance = await (
            await fetch(here('../../data/appearance.json'), { cache: 'no-cache' })
          ).json();
          const none = document.createElement('option');
          none.value = '';
          none.textContent = 'texture';
          $('skin').append(none);
          for (const tone of appearance.skinTones) {
            const option = document.createElement('option');
            option.value = tone.hex;
            option.textContent = `${tone.id} ${tone.hex}`;
            option.selected = tone.id === appearance.defaults.skinTone;
            $('skin').append(option);
          }
          skinTone = $('skin').value || null;
        } catch (e) {
          console.warn('appearance.json not read, no skin tones', e);
        }
        const gltf = await loader.loadAsync(here('../../zones/greyhaven/player.glb'));
        const model = gltf.scene;
        let bones = 0,
          tris = 0;
        const hideable = { sword: [], staff: [] };
        model.traverse((o) => {
          if (o.isBone) bones++;
          if (/^Sword_/.test(o.name)) hideable.sword.push(o);
          if (/^Staff_/.test(o.name)) hideable.staff.push(o);
          if (!(o instanceof Mesh)) return;
          o.frustumCulled = false;
          const index = o.geometry.index;
          tris += (index ? index.count : o.geometry.attributes.position.count) / 3;
          o.source = o.material; // the glTF materials: only their names matter
          meshes.push(o);
        });
        applyMaterials();
        $('game').addEventListener('change', applyMaterials);
        $('skin').addEventListener('change', () => {
          skinTone = $('skin').value || null;
          applySkinTone();
        });
        model.updateMatrixWorld(true);
        // Same as the game: feet on the floor, centred.
        const box = new Box3();
        model.traverse((o) => {
          if (o instanceof SkinnedMesh) box.expandByObject(o);
        });
        const c = box.getCenter(new Vector3());
        model.position.set(-c.x, -box.min.y, -c.z);
        scene.add(model);

        const setVisible = () => {
          for (const o of hideable.sword) o.visible = $('sword').checked;
          for (const o of hideable.staff) o.visible = $('staff').checked;
        };
        $('sword').addEventListener('change', setVisible);
        $('staff').addEventListener('change', setVisible);
        setVisible();

        mixer = new AnimationMixer(model);
        actions = gltf.animations.map((clip) => mixer.clipAction(clip));
        gltf.animations.forEach((clip, i) => {
          const b = document.createElement('button');
          b.innerHTML = `<span>${clip.name}</span><small>${clip.duration.toFixed(2)} s</small>`;
          b.addEventListener('click', () => play(i));
          $('clips').append(b);
          buttons.push(b);
        });
        $('info').textContent =
          `${bones} botten · ${gltf.animations.length} clips · ${Math.round(tris)} driehoeken · ` +
          `${(box.max.y - box.min.y).toFixed(2)} m`;
        const first = Math.max(
          0,
          gltf.animations.findIndex((a) => a.name === 'Idle'),
        );
        play(first);
        say('');
        renderer.setAnimationLoop(frame);
      }

      function frame() {
        const delta = Math.min(clock.getDelta(), 0.1);
        if (mixer && current && !paused) mixer.update(delta * speed);
        if (current) {
          const d = current.getClip().duration;
          const t = current.time % (d + 1e-6);
          if (!seeking) $('seek').value = String(Math.min(d, current.time >= d ? d : t));
          $('time').textContent = `${Math.min(d, current.time).toFixed(2)} / ${d.toFixed(2)} s`;
        }
        controls.update();
        renderer.render(scene, camera);
      }

      let seeking = false;
      $('seek').addEventListener('input', () => {
        if (!current) return;
        seeking = true;
        paused = true;
        $('pause').textContent = 'Verder';
        current.paused = false;
        current.time = Number($('seek').value);
        mixer.update(0);
      });
      $('seek').addEventListener('change', () => {
        seeking = false;
      });
      $('pause').addEventListener('click', () => {
        paused = !paused;
        $('pause').textContent = paused ? 'Verder' : 'Pauze';
      });
      $('speed').addEventListener('input', () => {
        speed = Number($('speed').value);
        $('speedv').textContent = `${speed.toFixed(2)}×`;
      });
      $('loop').addEventListener('change', () => {
        if (current) {
          current.setLoop($('loop').checked ? LoopRepeat : LoopOnce, Infinity);
          current.clampWhenFinished = true;
        }
      });
      addEventListener('keydown', (e) => {
        if (
          e.target instanceof HTMLInputElement &&
          e.target.type !== 'checkbox' &&
          e.target.type !== 'range'
        )
          return;
        if (e.code === 'Space') {
          e.preventDefault();
          $('pause').click();
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          step(1);
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          step(-1);
        }
      });

      start().catch((e) => {
        console.error(e);
        say('Laden mislukt: ' + (e?.message ?? e));
      });
    </script>
  </body>
</html>
